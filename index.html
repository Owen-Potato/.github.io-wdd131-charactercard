<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Card</title>
  <meta name="snortle" content="snortleblat">

  <link rel="stylesheet" href="snortleblat.css">
  <script src="snortleblat.js" defer></script>
</head>
<body>
  <main>
    <article class="card">
      <img class="image" id="image" src="images/snortleblat.webp" alt="Swamp Beast Diplomat" width="400" height="400">
      <h1 class="name" id="name">Name</h1>
      <div class="stats">
        <p><strong>Class:</strong> <span id="class"></span></p>
        <p><strong>Level:</strong> <span id="level"></span></p>
        <p><strong>Health:</strong> <span id="health"></span></p>
      </div>
      <div class="buttons">
        <button id="attacked" type="button">Attacked</button>
        <button id="levelUp" type="button">Level Up</button>
      </div>
    </article>

    <dialog id="deathDialog" class="popup" aria-labelledby="deathText">
      <p id="deathText"></p>
      <button id="closeDialog" type="button">Close</button>
    </dialog>
  </main>
</body>
</html>
